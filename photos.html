<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHOWCASE - ENGINEERING</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f2f2}
.header{background:linear-gradient(to right,#4d0000,#a80000,#4d0000);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.header .logo{font-weight:900;font-size:18px;line-height:1}
.header .logo span{color:#ffcc00}
.header small{font-size:9px;letter-spacing:1px;font-weight:400}
.menu{font-size:10px;display:flex;gap:16px}
.menu a{color:#fff;text-decoration:none;opacity:.8}
.menu a.active{opacity:1;font-weight:bold;border-bottom:2px solid #ffcc00}
.title{text-align:center;padding:16px;color:#c00000;font-size:13px;letter-spacing:1px}
.tabs{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;background:#fff;border-top:1px solid #ddd;border-bottom:1px solid #ddd}
.tabs button{border:none;padding:6px 12px;font-size:10px;cursor:pointer;background:#eee;font-weight:700}
.tabs button.active{background:#8b0000;color:#fff}
.gallery{background:#fff;padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:600px){.gallery{grid-template-columns:repeat(4,1fr)}}
.photo{border:2px solid #bbb;padding:2px;background:#fff;box-shadow:0 8px 6px -6px rgba(0,0,0,.5);cursor:pointer}
.photo img{width:100%;height:95px;object-fit:cover;display:block}
/* POPUP KAYA KRR - KLIK JADI BESAR */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:9999}
#lightbox.show{display:flex}
.box{background:#fff;padding:6px;max-width:92%;width:420px;position:relative;box-shadow:0 0 25px #000}
.box img{width:100%;display:block;max-height:70vh;object-fit:contain}
.box .bottom{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 2px;font-size:10px;color:#555}
.closeBtn{background:#222;color:#fff;border:none;padding:4px 12px;font-size:10px;cursor:pointer}
/* FOOTER ADA BACK TO HOME */
.footer{background:linear-gradient(to right,#2b0000,#7a0000,#2b0000);height:40px;margin-top:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;color:#fff;font-size:10px}
.footer a{color:#fff;text-decoration:none;opacity:.8}
.footer a:hover{opacity:1;color:#ffcc00}
</style>
</head>
<body>
<div class="header">
<div class="logo">⚙️ <span>ENGINEERING</span><br><small>PT ENGINEERING SURABAYA</small></div>
<div class="menu"><a href="index.html">HOME</a><a href="about.html">ABOUT</a><a href="photos.html" class="active">SHOWCASE</a><a href="#">CONTACT</a></div>
</div>

<div class="title">WELDING PROJECT - DROP TEST</div>

<div class="tabs">
<button class="active" onclick="filterGallery('all',this)">ALL</button>
<button onclick="filterGallery('steel',this)">STEEL STRUCTURE</button>
<button onclick="filterGallery('fab',this)">FABRICATION</button>
<button onclick="filterGallery('weld',this)">WELDING</button>
</div>

<div class="gallery" id="gallery">
<div class="photo steel" onclick="openBox(this)"><img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=500"></div>
<div class="photo fab" onclick="openBox(this)"><img src="https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=500"></div>
<div class="photo weld" onclick="openBox(this)"><img src="https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?w=500"></div>
<div class="photo steel" onclick="openBox(this)"><img src="https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=500"></div>
<div class="photo fab" onclick="openBox(this)"><img src="https://images.unsplash.com/photo-1513828583688-c52646db42da?w=500"></div>
<div class="photo weld" onclick="openBox(this)"><img src="https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=500"></div>
</div>

<!-- POPUP SAAT DI KLIK -->
<div id="lightbox" onclick="closeBox()">
<div class="box" onclick="event.stopPropagation()">
<img id="bigImg" src="">
<div class="bottom">
<span>◀ ▶ ● 1/5</span>
<button class="closeBtn" onclick="closeBox()">CLOSE &nbsp; x</button>
</div>
</div>
</div>

<!-- FOOTER ADA BACK TO HOME -->
<div class="footer">
<a href="index.html">← Back to Home</a>
<a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Home ↑ top</a>
</div>

<script>
function filterGallery(cat,btn){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 document.querySelectorAll('.photo').forEach(p=>{
   p.style.display = (cat==='all' || p.classList.contains(cat)) ? 'block' : 'none';
 });
}
function openBox(el){
 document.getElementById('bigImg').src = el.querySelector('img').src;
 document.getElementById('lightbox').classList.add('show');
}
function closeBox(){
 document.getElementById('lightbox').classList.remove('show');
}
</script>
</body>
</html>
