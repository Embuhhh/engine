<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');
body{display:flex;height:100vh;justify-content:center;align-items:center;text-align:center;background:#222;overflow:hidden;margin:0;font-family:'Poppins',sans-serif;flex-direction:column}
.title{position:relative;z-index:10;color:#fff;font-size:2rem;letter-spacing:0.3em;text-shadow:0 0 10px #00dbde;margin-bottom:20px}
.btn{position:relative;z-index:10;padding:1rem 3rem;font-weight:700;font-size:1.5rem;color:#fff;text-decoration:none;background:linear-gradient(90deg,#00dbde,#fc00ff,#00dbde);background-size:300%;border-radius:2em;cursor:pointer;display:inline-block;animation:glow 8s linear infinite}
.btn::before{position:absolute;content:"";top:-5px;left:-5px;bottom:-5px;right:-5px;z-index:-1;background:inherit;border-radius:4em;opacity:0;transition:.5s}
.btn:hover::before{opacity:1;filter:blur(20px)}@keyframes glow{to{background-position:300%}}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
#tap{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.7);color:#fff;font-size:18px;justify-content:center;align-items:center;cursor:pointer}
</style>
</head>
<body>
<div id="tap">🔊 TAP LAYAR UNTUK NYALAIN LAGU</div>
<canvas></canvas>

<audio id="musikEnggal" loop preload="auto" autoplay>
  <source src="./Kantata Takwa - Kesaksian.mp3" type="audio/mpeg">
</audio>

<div class="title">ENGGAL JAYA</div>
<a href="home.html" class="btn">ENTER</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/101/three.min.js"></script>
<script>
p = [[389,246,0],[410,255,20],[413,268,7],[431,261,12],[418,244,30],[416,217,25],[420,205,8],[427,227,-20],[432,236,5],[444,228,12],[451,232,41],[446,246,72],[443,264,96],[446,278,65],[463,267,20],[460,258,-10],[464,243,-20],[459,233,0],[475,225,22],[484,225,29],[490,214,51],[476,202,55],[462,202,55],[446,205,42],[440,192,42],[430,183,72],[413,184,58],[406,191,32],[406,207,0],[402,220,0],[390,222,20],[385,228,10],[389,246,0]];
</script>
<script>
var w=innerWidth,h=innerHeight;onresize=function(){w=innerWidth;h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}
cameraSpeed=.00015;lightSpeed=.001;tubularSegments=1000;radialSegments=3;tubeRadius=2;ambientLight=0x222222;lightColor=0xffffff;lightIntensity=1;lightDistance=20;hs=0;he=360;
var renderer=new THREE.WebGLRenderer({canvas:document.querySelector("canvas"),antialias:true});renderer.setSize(w,h);
var scene=new THREE.Scene();var camera=new THREE.PerspectiveCamera(60,w/h,.001,1000);
var starsGeometry=new THREE.Geometry();for(i=0;i<3000;i++){var star=new THREE.Vector3();star.x=THREE.Math.randFloatSpread(1500);star.y=THREE.Math.randFloatSpread(1500);star.z=THREE.Math.randFloatSpread(1500);starsGeometry.vertices.push(star)}
var starsMaterial=new THREE.PointsMaterial({color:0xffffff});var starField=new THREE.Points(starsGeometry,starsMaterial);scene.add(starField);
for(i=0;i<p.length;i++){var x=p[i][0];var y=p[i][2];var z=p[i][1];p[i]=new THREE.Vector3(x,y,z)}
var path=new THREE.CatmullRomCurve3(p);var geometry=new THREE.TubeGeometry(path,tubularSegments,tubeRadius,radialSegments,true);
hue=hs;hup=true;for(i=0;i<geometry.faces.length;i++){hup==1?hue++:hue--;hue==he?hup=false:(hue==hs)?hup=true:0;geometry.faces[i].color=new THREE.Color("hsl("+hue+",100%,50%)")}
var material=new THREE.MeshLambertMaterial({side:THREE.BackSide,vertexColors:THREE.FaceColors,wireframe:true});
var tube=new THREE.Mesh(geometry,material);scene.add(tube);
var light=new THREE.PointLight(0xffffff,1,50);scene.add(light);var light2=new THREE.AmbientLight(ambientLight);scene.add(light2);
var l1=new THREE.PointLight(lightColor,lightIntensity,lightDistance);scene.add(l1);var l2=new THREE.PointLight(lightColor,lightIntensity,lightDistance);scene.add(l2);var l3=new THREE.PointLight(lightColor,lightIntensity,lightDistance);scene.add(l3);var l4=new THREE.PointLight(lightColor,lightIntensity,lightDistance);scene.add(l4);var l5=new THREE.PointLight(lightColor,lightIntensity,lightDistance);scene.add(l5);
var pct=0,pct2=0;function render(){pct+=cameraSpeed;pct2+=lightSpeed;var pt1=path.getPointAt(pct%1);var pt2=path.getPointAt((pct+.01)%1);camera.position.set(pt1.x,pt1.y,pt1.z);camera.lookAt(pt2);light.position.set(pt2.x,pt2.y,pt2.z);l1.position.set(path.getPointAt((pct2+.0)%1).x,path.getPointAt((pct2+.0)%1).y,path.getPointAt((pct2+.0)%1).z);l2.position.set(path.getPointAt((pct2+.2)%1).x,path.getPointAt((pct2+.2)%1).y,path.getPointAt((pct2+.2)%1).z);l3.position.set(path.getPointAt((pct2+.4)%1).x,path.getPointAt((pct2+.4)%1).y,path.getPointAt((pct2+.4)%1).z);l4.position.set(path.getPointAt((pct2+.6)%1).x,path.getPointAt((pct2+.6)%1).y,path.getPointAt((pct2+.6)%1).z);l5.position.set(path.getPointAt((pct2+.8)%1).x,path.getPointAt((pct2+.8)%1).y,path.getPointAt((pct2+.8)%1).z);renderer.render(scene,camera);requestAnimationFrame(render)}requestAnimationFrame(render);
</script>
<script>
const musik=document.getElementById('musikEnggal');
const tap=document.getElementById('tap');
musik.volume=0.8;
function playLagu(){musik.play().then(()=>{tap.style.display='none'}).catch(()=>{tap.style.display='flex'})}
window.addEventListener('load',playLagu);
document.body.addEventListener('click',playLagu,{once:true});
tap.addEventListener('click',playLagu);
</script>
</body>
</html>
