<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENGINEERING</title>
<style>
body{margin:0;width:100%;height:100vh;display:flex;background-image:linear-gradient(120deg, rgba(255, 179, 26, 0.489) 0%, rgba(255, 179, 26, 0.489) 100%);font-family:"Poppins",serif}
.spectacledcoder-expanding-cards-container{margin:auto;width:500px;height:400px;background:#fff;display:flex;padding-left:30px;border-radius:70px;zoom:.7}
.spectacledcoder-cards{margin:auto;display:flex;width:90%;height:90%;border-radius:50px;align-items:center}
.spectacledcoder-cards .card{position:absolute;margin:auto;width:250px;height:250px;border-radius:60px;background:#ffac40;border-left:1px solid #ffd399;display:flex;cursor:pointer;align-items:center;justify-content:center;box-shadow:0 0 0 rgba(255,186,49,.226);z-index:150}
.spectacledcoder-cards .card:hover{box-shadow:-20px -20px 0 rgba(255,186,49,.226);transition:box-shadow 1s}
.spectacledcoder-cards .card:first-child{background-color:#ffac40;background-image:url("https://i.ibb.co/2YqvV2Pk/1726793978883-picsay.png");background-position:center;background-repeat:no-repeat}
.spectacledcoder-cards .card:nth-child(2){background-color:#ffac40;margin-left:50px;background-image:url("https://img.icons8.com/external-flatart-icons-solid-flatarticons/100/external-chicken-leg-grocery-flatart-icons-solid-flatarticons-2.png");background-position:center;background-repeat:no-repeat}
.spectacledcoder-cards .card:nth-child(3){background-color:#ffac40;margin-left:100px;background-image:url("https://img.icons8.com/stamp/100/salami-pizza.png");background-position:center;background-repeat:no-repeat}
.spectacledcoder-cards .card:last-child{background-color:#ffac40;margin-left:150px;background-image:url("https://img.icons8.com/pastel-glyph/100/chupa-chups.png");background-position:center;background-repeat:no-repeat}
.spectacledcoder-cards .card h2{margin:auto;margin-top:30px;margin-left:30px;color:#fff;font-size:18px}
.spectacledcoder-cards .card .bigsquare{margin:auto;margin-right:0;margin-bottom:0;width:90px;height:90px;background:#fff;display:flex;z-index:30}
.spectacledcoder-cards .card .bigsquare .col{margin:auto;width:50%;height:100%;display:flex;flex-direction:column}
.spectacledcoder-cards .card .bigsquare .col .sq1{margin:auto;margin-top:0;margin-left:0;width:40px;height:40px;background:#ffac40;display:flex}
.spectacledcoder-cards .card .bigsquare .col .sq1 .cl1{margin:auto;width:40px;height:40px;border-radius:100% 0% 100% 0% / 100% 100% 0% 0%;background:#fff;display:flex}
.spectacledcoder-cards .card .bigsquare .col .sq2{margin:auto;margin-bottom:0;margin-left:-40px;width:40px;height:40px;background:#fff;display:flex}
.spectacledcoder-cards .card .bigsquare .col .sq2 .cl2{margin:auto;width:40px;height:40px;border-radius:100% 0% 100% 0% / 0% 0% 100% 100%;background:#ffac40;display:flex}
.spectacledcoder-cards .card .bigsquare .col .sq3{margin:auto;margin-top:-40px;margin-right:0;width:40px;height:40px;background:#fff;display:flex}
.spectacledcoder-cards .card .bigsquare .col .sq3 .cl3{margin:auto;width:40px;height:40px;border-radius:100% 0% 100% 0% / 0% 0% 100% 100%;background:#ffac40;display:flex}
.spectacledcoder-cards .card .sq4{position:absolute;margin:auto;margin-bottom:10px;margin-left:0;width:0;height:0;background:#ffac40;display:flex;border-radius:30%;z-index:50;opacity:0}
.spectacledcoder-cards .card:hover .sq4{transform:translateX(90px) translateY(90px);width:40px;height:40px;opacity:100;transition:all .7s}
.spectacledcoder-cards .card .sq4 img{margin:auto;rotate:-45deg;width:0;height:0}
.spectacledcoder-cards .card:hover .sq4 img{width:40px;height:40px;transition:all 1s}
.expanding-btn{width:60px;height:100px;margin:auto;margin-right:-15px;display:flex;flex-direction:column}
.expanding-btn .square1{width:20px;height:20px;margin:auto;margin-right:-5px;margin-bottom:-6px;background:#fff}
.expanding-btn .square1 .circle1{width:20px;height:20px;border-radius:100% 0% 26% 74% / 0% 100% 0% 100%;background:rgba(255,179,26,.489)}
.expand-btn-container{margin:auto;margin-right:-15px;width:61px;height:61px;background:#fff;border-radius:50%;z-index:150;display:flex}
.expand-btn-container img{margin:auto;margin-right:5px;z-index:150}
.expanding-btn .square2{width:20px;height:20px;margin:auto;margin-right:-5px;margin-top:-5px;background:#fff}
.expanding-btn .square2 .circle2{width:20px;height:20px;border-radius:74% 26% 0% 100% / 100% 0% 100% 0%;background:rgba(255,179,26,.489)}
@media only screen and (max-width:700px){body{height:100vh;max-height:100%}.spectacledcoder-expanding-cards-container{margin:auto;width:80%;height:400px;flex-direction:column;padding-left:0}.spectacledcoder-cards{margin:auto;flex-direction:column;justify-content:start;margin-top:50px}.spectacledcoder-cards .card{border-top:1px solid #ffd399;zoom:.6}.spectacledcoder-cards .card:first-child{margin-left:0}.spectacledcoder-cards .card:nth-child(2){margin-top:50px;margin-left:0}.spectacledcoder-cards .card:nth-child(3){margin-top:100px;margin-left:0}.spectacledcoder-cards .card:last-child{margin-top:150px;margin-left:0}.expanding-btn{width:100px;height:100px;flex-direction:row;margin:auto!important}.expanding-btn .square1{margin:auto;margin-bottom:-20px;margin-right:-5px}.expanding-btn .square1 .circle1{border-radius:0% 100% 0% 100% / 100% 74% 26% 0%}.expand-btn-container{margin:auto;margin-bottom:-30px}.expand-btn-container img{margin:auto;rotate:90deg;margin-bottom:5px}.expanding-btn .square2{margin:auto;margin-left:-5px;margin-bottom:-20px}.expanding-btn .square2 .circle2{border-radius:100% 0% 100% 0% / 74% 100% 0% 26%}}
</style>
</head>
<body>
<div class="spectacledcoder-expanding-cards-container">
<div class="spectacledcoder-cards">
    <div class="card" onclick="location.href='home.html'">
        <h2>HOME</h2>
        <div class="bigsquare"><div class="col"><div class="sq1"><div class="cl1"></div></div><div class="sq2"><div class="cl2"></div></div></div><div class="col"><div class="sq3"><div class="cl3"></div></div></div></div>
        <div class="sq4"><img width="35" src="https://img.icons8.com/ios-filled/50/ffffff/long-arrow-right.png"></div>
    </div>
    <div class="card" onclick="location.href='photos.html'">
        <h2>SHOWCASE</h2>
        <div class="bigsquare"><div class="col"><div class="sq1"><div class="cl1"></div></div><div class="sq2"><div class="cl2"></div></div></div><div class="col"><div class="sq3"><div class="cl3"></div></div></div></div>
        <div class="sq4"><img width="35" src="https://img.icons8.com/ios-filled/50/ffffff/long-arrow-right.png"></div>
    </div>
    <div class="card" onclick="location.href='about.html'">
        <h2>ABOUT</h2>
        <div class="bigsquare"><div class="col"><div class="sq1"><div class="cl1"></div></div><div class="sq2"><div class="cl2"></div></div></div><div class="col"><div class="sq3"><div class="cl3"></div></div></div></div>
        <div class="sq4"><img width="35" src="https://img.icons8.com/ios-filled/50/ffffff/long-arrow-right.png"></div>
    </div>
    <div class="card" onclick="location.href='https://wa.me/6281234567890'">
        <h2>CONTACT</h2>
        <div class="bigsquare"><div class="col"><div class="sq1"><div class="cl1"></div></div><div class="sq2"><div class="cl2"></div></div></div><div class="col"><div class="sq3"><div class="cl3"></div></div></div></div>
        <div class="sq4"><img width="35" src="https://img.icons8.com/ios-filled/50/ffffff/long-arrow-right.png"></div>
    </div>
</div>
</div>
</body>
</html>
